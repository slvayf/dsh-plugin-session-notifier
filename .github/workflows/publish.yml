name: publish

# Release driven by a version tag.
#
# The upload uses npm's Trusted Publisher: this job exchanges a GitHub OIDC token for
# permission to publish, so no long-lived npm token is stored in the repository.
# `npm publish` runs `prepublishOnly` → `npm run verify`, so a failing check aborts the
# release, and provenance is generated automatically.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5 or newer to exchange the OIDC token.
      - name: Use a current npm
        run: npm install -g 'npm@^11.5.1'

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json $version" >&2
            exit 1
          fi

      - name: Publish to npm
        run: npm publish

      # npm reserves a brand-new package name with a temporary `0.0.0-stage` version
      # that can hold the `latest` tag, so a plain install would resolve to the stub.
      - name: Point latest at the released version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          npm dist-tag add "$name@$version" latest
